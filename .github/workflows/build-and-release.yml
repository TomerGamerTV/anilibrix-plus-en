name: Build and Release All Platforms

on:
  push:
    tags:
      - 'v*.*.*' # Trigger on version tags like v1.0.0

jobs:
  build_and_release:
    permissions: write-all
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false # Ensure all jobs run even if one fails
      matrix:
        os: [ubuntu-latest, macos-13, windows-2022]
        node-version: [14.x] # Matches README
        include:
          - os: ubuntu-latest
            platform_build_command: npm run release:lin # From README
            artifact_name_suffix: linux
            artifacts_path: |
              release/*.snap
              release/*.AppImage
              release/linux-arm64-unpacked
              release/linux-unpacked
              release/linux-ia32-unpacked
          - os: macos-13
            platform_build_command: npm run release:mac # From README
            artifact_name_suffix: macos
            artifacts_path: release/*.dmg
          - os: windows-2022
            platform_build_command: npm run release:win # From README
            artifact_name_suffix: windows
            artifacts_path: |
              release/*.exe
              release/win-arm64-unpacked
              release/win-unpacked
              release/win-ia32-unpacked

    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      # Add all required secrets from existing workflows
      ADS_URLS: ${{ secrets.ADS_URLS }}
      VK_APP_ID: ${{ secrets.VK_APP_ID }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      API_ENDPOINT_URL: ${{ secrets.API_ENDPOINT_URL }}
      YANDEX_TRACKING_ID: ${{ secrets.YANDEX_TRACKING_ID }}
      STATIC_ENDPOINT_URL: ${{ secrets.STATIC_ENDPOINT_URL }}
      DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
      EXT_API_SERVER: ${{ secrets.EXT_API_SERVER }}
      # macOS specific env
      PYTHON: python3.10
      NODE_GYP_FORCE_PYTHON: python3.10
      OPERA_PROXY_RELEASE_URL: https://github.com/Snawoot/opera-proxy/releases/download/v1.3.1


    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3 # Updated to v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3 # Updated to v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Get yarn cache directory
        id: yarn-cache-dir-path
        run: echo "::set-output name=dir::$(yarn cache dir)"

      - name: Cache Node.js modules (Yarn)
        uses: actions/cache@v3 # Updated to v3
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Cache Electron
        uses: actions/cache@v3 # Updated to v3
        with:
          path: ${{ env.ELECTRON_CACHE }}
          key: ${{ runner.os }}-electron-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Cache Electron-Builder
        uses: actions/cache@v3 # Updated to v3
        with:
          path: ${{ env.ELECTRON_BUILDER_CACHE }}
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: Install multilib (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get -y install gcc-multilib g++-multilib

      - name: Setup Python for node-gyp (macOS only)
        if: runner.os == 'macOS'
        run: |
          brew list python@3.10 || brew install python@3.10
          echo "/usr/local/opt/python@3.10/libexec/bin" >> $GITHUB_PATH

      - name: Patch node-gyp for Visual Studio (Windows only)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          npm install --global node-gyp@latest
          npm prefix -g | % {npm config set node_gyp "$_\node_modules\node-gyp\bin\node-gyp.js"}

      - name: Copy .env.example to .env
        run: cp .env.example .env
        # Potentially sed commands here if specific values need to be set in .env from secrets for the build
        # For example:
        # run: |
        #   cp .env.example .env
        #   sed -i "s|^SENTRY_DSN=.*|SENTRY_DSN=${{ secrets.SENTRY_DSN }}|" .env
        #   sed -i "s|^VK_APP_ID=.*|VK_APP_ID=${{ secrets.VK_APP_ID }}|" .env
        #   # ... and so on for other .env variables that need to be populated from secrets

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download opera proxy (macOS only)
        if: runner.os == 'macOS'
        run: yarn run operaproxy-download

      - name: Run build for ${{ matrix.os }}
        run: ${{ matrix.platform_build_command }}

      - name: Upload Artifacts (for individual inspection if needed)
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts-${{ matrix.artifact_name_suffix }}
          path: ${{ matrix.artifacts_path }}

  # This job depends on all build jobs completing successfully
  create_release:
    name: Create GitHub Release
    needs: build_and_release # Depends on the build_and_release job matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create releases

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v3
        # No 'with.name' specified, downloads all artifacts produced by this workflow run
        # Artifacts will be in directories named after them, e.g., build-artifacts-linux/

      - name: List downloaded files (for debugging)
        run: |
          ls -R
          echo "GITHUB_REF_NAME: $GITHUB_REF_NAME"
          echo "GITHUB_REF_TYPE: $GITHUB_REF_TYPE"

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') # Only run for tags
        with:
          # This will create a release with the tag name
          # e.g., if tag is v1.0.0, release will be named v1.0.0
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: "Automated release for ${{ github.ref_name }}"
          draft: false
          prerelease: false # Set to true if these are pre-releases
          files: |
            build-artifacts-linux/*
            build-artifacts-macos/*
            build-artifacts-windows/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
